name: Sync Publications

on:
  schedule:
    - cron: "30 16 * * *"  # 每天台北時間 00:30
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/papers.yml

permissions:
  contents: write

concurrency:
  group: papers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch papers & update README
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}  # optional
        run: python3 scripts/update_papers.py

      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync publications"
          git push
