<svg xmlns="http://www.w3.org/2000/svg" width="880" height="418" viewBox="0 0 880 418"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><text x="0" y="34" font-size="17" fill="#f0f6fc">Ph.D. student in Computer Science at National Yang Ming Chiao Tung University.</text><text x="0" y="62" font-size="17" fill="#f0f6fc">My research is on table retrieval &amp; table QA, tool retrieval for LLM agents,</text><text x="0" y="90" font-size="17" fill="#f0f6fc">and NLP for Taiwan&#x27;s indigenous languages. I also love backend &amp; infra work.</text><g transform="translate(0.0 130)"><rect x=".5" y=".5" width="431.0" height="127" rx="14" fill="#151b23" stroke="#30363d"/><rect x="24" y="26" width="28" height="4" rx="2" fill="#818cf8"/><text class="m" x="408.0" y="34" font-size="12" text-anchor="end" fill="#9198a1">01</text><text x="24" y="62" font-size="18" font-weight="700" fill="#f0f6fc">Table Retrieval &amp; QA</text><text x="24" y="88" font-size="14" fill="#9198a1">Header-aware representations and LLM-made supervision</text><text x="24" y="108" font-size="14" fill="#9198a1">for finding the right table.</text></g><g transform="translate(448.0 130)"><rect x=".5" y=".5" width="431.0" height="127" rx="14" fill="#151b23" stroke="#30363d"/><rect x="24" y="26" width="28" height="4" rx="2" fill="#f472b6"/><text class="m" x="408.0" y="34" font-size="12" text-anchor="end" fill="#9198a1">02</text><text x="24" y="62" font-size="18" font-weight="700" fill="#f0f6fc">Tool Retrieval</text><text x="24" y="88" font-size="14" fill="#9198a1">Training-free ways for LLM agents to pick the right tool</text><text x="24" y="108" font-size="14" fill="#9198a1">from thousands.</text></g><g transform="translate(0.0 274)"><rect x=".5" y=".5" width="431.0" height="127" rx="14" fill="#151b23" stroke="#30363d"/><rect x="24" y="26" width="28" height="4" rx="2" fill="#22d3ee"/><text class="m" x="408.0" y="34" font-size="12" text-anchor="end" fill="#9198a1">03</text><text x="24" y="62" font-size="18" font-weight="700" fill="#f0f6fc">Low-Resource NLP</text><text x="24" y="88" font-size="14" fill="#9198a1">Translation and dialogue for Taiwan&#x27;s indigenous</text><text x="24" y="108" font-size="14" fill="#9198a1">languages with LLMs.</text></g><g transform="translate(448.0 274)"><rect x=".5" y=".5" width="431.0" height="127" rx="14" fill="#151b23" stroke="#30363d"/><rect x="24" y="26" width="28" height="4" rx="2" fill="#818cf8"/><text class="m" x="408.0" y="34" font-size="12" text-anchor="end" fill="#9198a1">04</text><text x="24" y="62" font-size="18" font-weight="700" fill="#f0f6fc">Systems &amp; Infra</text><text x="24" y="88" font-size="14" fill="#9198a1">Backend, self-hosted LLM serving, and the plumbing that</text><text x="24" y="108" font-size="14" fill="#9198a1">makes research ship.</text></g></svg>