<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.ring{transform-origin:720px 150px;animation:spin 24s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.blob1{animation:drift 9s ease-in-out infinite alternate}.blob2{animation:drift 11s ease-in-out infinite alternate-reverse}@keyframes drift{to{transform:translate(-30px,20px)}}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#115e59"/><stop offset="1" stop-color="#1f2328"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#d0d7de"/></pattern>
  <clipPath id="cardclip"><rect width="880" height="300" rx="20"/></clipPath>
</defs>
<g clip-path="url(#cardclip)">
  <rect width="880" height="300" fill="#ffffff"/>
  <rect width="880" height="300" fill="url(#dots)" opacity=".7"/>
  <circle class="blob1" cx="680" cy="110" r="110" fill="#115e59" opacity=".35" filter="url(#blur)"/>
  <circle class="blob2" cx="780" cy="210" r="100" fill="#115e59" opacity=".22" filter="url(#blur)"/>
</g>
<rect x=".5" y=".5" width="879" height="299" rx="20" fill="none" stroke="#d0d7de"/>
<text class="m" x="48" y="92" font-size="13" letter-spacing="2.5" fill="#115e59" font-weight="600">PH.D. STUDENT · COMPUTER SCIENCE · NYCU</text>
<text x="45" y="160" font-size="62" font-weight="800" letter-spacing="-1.5" fill="url(#g)">Chen-Jui Yu</text>
<text x="48" y="206" font-size="19" fill="#59636e">Tables · Multimodal Learning · RL · LLMs</text>
<g class="ring"><circle cx="720" cy="150" r="108" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-dasharray="6 10" stroke-linecap="round"/></g>
<circle cx="720" cy="150" r="99" fill="#ffffff"/>
