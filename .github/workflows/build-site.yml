name: Build Profile Site

on:
  schedule:
    - cron: "30 16 * * *"  # 每天台北時間 00:30：同步論文、更新 NEW 標籤
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site.json
      - scripts/**
      - .github/workflows/build-site.yml

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build README + SVG components
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}  # optional
        run: python3 scripts/build_site.py

      - name: Commit if changed
        run: |
          git add -A README.md assets/
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild profile site"
          git push
